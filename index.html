<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>カバゲーセン</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <main id="app">

    <!-- TITLE -->

    <section id="titleScreen" class="title-screen">

      <img
        src="images/kabagesen.png"
        alt="カバゲーセン"
        class="title-image"
      >

      <div class="tap-start">
        PRESS START BUTTON
      </div>

    </section>

    <!-- SELECT -->

    <section id="selectScreen" class="select-screen hidden">

      <header class="select-header">
        <h1>GAME SELECT</h1>
        <p>すきなゲームをえらんでください</p>
      </header>

      <div class="cover-flow">

        <button id="prevButton" class="nav-button">
          ◀
        </button>

        <div id="coverTrack" class="cover-track"></div>

        <button id="nextButton" class="nav-button">
          ▶
        </button>

      </div>

      <section class="game-info">

        <h2 id="gameTitle"></h2>

        <p id="gameDescription"></p>

      </section>

      <button id="playButton" class="play-button">
        ▶ PLAY
      </button>

    </section>

  </main>

  <script src="game.js"></script>

</body>
</html>
