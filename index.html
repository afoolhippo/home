<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>カバゲーセン</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="site">

    <!-- ロビー -->

    <section class="lobby" id="top">

      <img
        src="main-visual.png"
        alt="カバゲーセン"
        class="main-visual"
      >

      <p class="catch">
        変なゲームしか置いてない、<br>
        とある町はずれのゲームセンター。
      </p>

      <!-- おしらせ -->

      <section class="news">

        <div class="news-box">

          <span class="news-title">
            📢 おしらせ
          </span><br>

          <span class="news-new">
            NEW!
          </span><br>

          箱太郎伝説 追加！<br>
          サルトリイバラ 公開中！<br>

          変なゲームを日々開発中。

        </div>

      </section>

      <button
        id="randomBtn"
        class="random-btn"
      >
        🎲 ランダムで遊ぶ
      </button>

    </section>

    <!-- フロアナビ -->

    <nav class="floor-nav">

      <a href="#floor1">
        🍭 キッズ
      </a>

      <a href="#floor2">
        🌇 放課後
      </a>

      <a href="#food">
        🍜 フード
      </a>

      <a href="#drink">
        🥤 ドリンク
      </a>


    </nav>

    <!-- ゲーム一覧 -->

    <main id="gameArea"></main>

    <!-- フッター -->

    <footer class="footer">

      <a href="#top" class="back-top">
        ▲ ロビーへ戻る
      </a>

      <h3 class="creator-title">
        製作者 a fool hippo（バカなカバ）
      </h3>

      <img
        src="profile.png"
        alt="a fool hippo"
        class="profile-image"
      >

      <p class="profile">
        福岡市東区箱崎を拠点に活動している<br>
        シンガーソングライター。<br><br>

        好きな食べ物や何気ない日常の風景を切り取り、<br>
        日々曲を作ったり、商店街のマルシェなどで<br>
        ライブを行っています。<br><br>

        最近はゲーム開発に目覚め、日々、無我夢中。
      </p>

      <div class="sns-links">

        <a
          href="https://bakanakaba.wixsite.com/afoolhippo/"
          target="_blank"
        >
          HP
        </a>

        <a
          href="https://www.instagram.com/a_fool_hippo/"
          target="_blank"
        >
          Instagram
        </a>

        <a
          href="https://x.com/quickmen/"
          target="_blank"
        >
          X
        </a>

        <a
          href="https://www.youtube.com/@afoolhippo/"
          target="_blank"
        >
          YouTube
        </a>

      </div>

    </footer>

  </div>

  <script src="game.js"></script>

</body>
</html>
