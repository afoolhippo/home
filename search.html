<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="カバゲーセンのゲームをジャンルから探せるゲーム検索機です。">
  <title>ゲーム検索機｜カバゲーセン</title>
  <link rel="stylesheet" href="./assets/css/search.css">
</head>

<body>
  <main class="search-page">
    <section class="search-hero" aria-labelledby="searchTitle">
      <h1 id="searchTitle" class="search-title">
        ゲーム検索機
      </h1>

      <p class="search-lead">
        あそびたいジャンルをえらんでね！
      </p>
    </section>

    <section class="genre-section" aria-label="ジャンルを選ぶ">
      <div id="genreButtons" class="genre-buttons"></div>

      <button id="showAllBtn" class="show-all-btn" type="button">
        すべて見る
      </button>
    </section>

    <section
      id="resultSection"
      class="result-section hidden"
      aria-live="polite"
    >
      <h2 id="resultTitle" class="result-title"></h2>
      <div id="resultGrid" class="result-grid"></div>
    </section>
  </main>

  <footer class="search-footer">
    <a href="./index.html">← カバゲーセンへ戻る</a>
  </footer>

  <script src="./assets/js/game-catalog.js"></script>
  <script src="./assets/js/search.js"></script>
</body>
</html>
